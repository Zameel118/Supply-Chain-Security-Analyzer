# Quaywatch — Render Blueprint (free-tier compatible)
# https://render.com/docs/blueprint-spec
#
# Free plan supports: web + Postgres + Key Value (Redis).
# It does NOT support Background Workers — Celery runs inside quaywatch-api
# via scripts/start_web.sh.
#
# Optional paid workers: see render.workers.yaml (Starter plan or higher).

databases:
  - name: quaywatch-db
    plan: free
    databaseName: quaywatch
    user: quaywatch

services:
  - type: keyvalue
    name: quaywatch-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: [] # private: only Render services

  - type: web
    name: quaywatch-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Starts Celery worker + uvicorn (free-tier workaround)
    dockerCommand: sh scripts/start_web.sh
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quaywatch-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: quaywatch-redis
          type: keyvalue
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        sync: false # MUST set: Fernet key (see PHASE_9_DEPLOY_GUIDE.txt)
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false # https://<quaywatch-api>.onrender.com/api/auth/github/callback
      - key: FRONTEND_URL
        sync: false # https://<your-app>.vercel.app
      - key: CORS_ORIGINS
        sync: false # same as FRONTEND_URL (comma-separated if multiple)
      - key: PERIODIC_RESCAN_ENABLED
        value: "false"
      - key: PERIODIC_RESCAN_INTERVAL_HOURS
        value: "24"
      - key: PERIODIC_RESCAN_MIN_AGE_HOURS
        value: "20"
